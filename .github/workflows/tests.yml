name: tests

# The tests that need no model weights: transliteration, text normalisation,
# corrections, lessons and Lakshya tags, curriculum import rules, worksheets,
# the offline frontend and the HTTPS certificate. The model tests skip
# themselves here because the weights (about 4 GB) are not in the repository.
on:
  push:
  pull_request:

jobs:
  no-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-dev.txt
      - run: pip install -r requirements-ci.txt
      # Dev/test-only AGPL tools (aksharamukha, pymupdf), pinned in
      # requirements-dev.txt only: installed here for the tests, never shipped.
      - run: grep -E '^(aksharamukha|pymupdf)==' requirements-dev.txt > agpl-test-tools.txt && pip install -r agpl-test-tools.txt
      - run: python -m pytest -q -rs --junitxml=junit.xml
      # The step logs need a GitHub login; the run summary does not. Publish the
      # counts, and the old-WebView (Chrome 69) test by name, where anyone can read them.
      - if: always()
        run: python .github/ci_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"
